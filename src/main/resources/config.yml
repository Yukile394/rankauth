# RankAuth configuration

auth:
  registration-time-seconds: 180
  login-time-seconds: 180
  minimum-password-length: 10
  require-uppercase: true
  require-lowercase: true
  require-number: true
  max-failed-login-attempts: 5
  failed-login-lockout-seconds: 60

verification:
  code-length: 6
  expiration-seconds: 300

database:
  type: sqlite
  # Reserved for future MySQL/MariaDB support.
  mysql:
    host: localhost
    port: 3306
    database: rankauth
    username: rankauth
    # Prefer environment variable RANKAUTH_DB_PASSWORD over this field.
    password: ""
    use-ssl: false

smtp:
  host: smtp.example.com
  port: 587
  starttls: true
  # Username/password are read from environment variables first:
  #   RANKAUTH_SMTP_USERNAME / RANKAUTH_SMTP_PASSWORD
  # These fields are only a fallback and should be left blank in production.
  username: ""
  password: ""
  from-address: no-reply@example.com
  from-name: RankAuth
  subject: "Doğrulama Kodu"

hub:
  # Command executed as the player once registration completes (no leading slash).
  command: "hub"

op-security:
  enabled: true
  # Trust the proxy's forwarded player IP (set true only if the server sits
  # behind Velocity/BungeeCord with player-info-forwarding-mode configured).
  behind-proxy: false

session:
  # Short-lived trusted-session auto-login. Independent from OP IP locking.
  enabled: true
  duration: 60

messages:
  prefix: "Silvera"
  weak-password: "&cŞifreniz çok zayıf."
  password-mismatch: "&cŞifreler eşleşmiyor."
  wrong-password: "&cŞifre yanlış."
  verification-sent: "&aDoğrulama kodu e-posta adresinize gönderildi."
  wrong-code: "&cDoğrulama kodu yanlış."
  invalid-email: "&cGeçerli bir e-posta adresi girin."
  need-login: "&cÖnce giriş yapmanız gerekiyor."
  need-register: "&cÖnce kayıt işlemini tamamlamanız gerekiyor."
  op-ip-locked: "&cBu OP hesabına kayıtlı IP adresinden giriş yapmanız gerekiyor."
  registration-timeout: "&cKayıt süresi doldu. Sunucudan çıkarılıyorsunuz."
  rate-limited: "&cÇok fazla yanlış deneme. Lütfen biraz sonra tekrar deneyin."
  duplicate-connection: "&cBu kullanıcı adı şu anda sunucuda kullanımda."
