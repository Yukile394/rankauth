# RankAuth configuration

auth:
  registration-time-seconds: 180
  login-time-seconds: 180
  minimum-password-length: 8
  require-uppercase: false
  require-lowercase: false
  require-number: false
  max-failed-login-attempts: 5
  failed-login-lockout-seconds: 60

verification:
  code-length: 6
  expiration-seconds: 300

database:
  type: sqlite
  mysql:
    host: localhost
    port: 3306
    database: rankauth
    username: rankauth
    password: ""
    use-ssl: false

smtp:
  host: smtp.example.com
  port: 587
  starttls: true
  username: ""
  password: ""
  from-address: no-reply@example.com
  from-name: RankAuth
  subject: "Doğrulama Kodu"

# Kayıt/giriş ekranında oynayan sakinleştirici arkaplan müziği.
# Oyuncu kayıt/giriş olana kadar döngüde çalar, authenticated olunca durur.
music:
  enabled: true
  # Herhangi bir Minecraft ses kaydı (sakin olanlar): minecraft:music_disc.cat,
  # minecraft:music_disc.far, minecraft:music.overworld.forest ...
  sound: "minecraft:music_disc.cat"
  volume: 0.6
  pitch: 1.0
  # Sesin uzunluğu (saniye) - süre dolunca otomatik yeniden başlar.
  loop-seconds: 185

# İlk girişte (kayıt tamamlanana kadar) oyuncuya gösterilen bilgilendirme ekranı.
# Renkler: beyaz &#FFFFFF, açık pembe &#FFB6C1, turuncu &#FFA500
welcome:
  lines:
    - ""
    - "&#FFA500         SILVERA SUNUCUSUNA HOŞ GELDİN"
    - ""
    - "&#FFFFFFBuraya ilk defa geliyorsun, önce hesabını oluşturman gerekiyor."
    - "&#FFB6C1- &#FFFFFF/register <şifre> <email> yaz."
    - "&#FFB6C1- &#FFFFFFE-postana gelen 6 haneli kodu &#FFB6C1/kod <kod>&#FFFFFF ile gir."
    - ""
    - "&#FFA500Kayıt tamamlanana kadar hareket edemez ve düşemezsin,"
    - "&#FFA500altında görünmez bir koruma bloğu var."
    - ""

hub:
  command: "hub"

op-security:
  enabled: true
  behind-proxy: false

session:
  enabled: true
  # Saniye cinsinden. 10800 = 3 saat.
  duration: 10800

# Renk paleti: beyaz &#FFFFFF (normal metin), açık pembe &#FFB6C1 (vurgu/uyarı),
# turuncu &#FFA500 (hata/dikkat).
messages:
  prefix: "&#FFA500Silvera"
  register-prompt: "&#FFFFFFKayıt olmak için: &#FFB6C1/register <şifre> <email>"
  code-prompt: "&#FFFFFFE-postana gelen kodu girmek için: &#FFB6C1/kod <kod>"
  login-prompt: "&#FFFFFFGiriş yapmak için: &#FFB6C1/login <şifre>"
  register-success: "&#FFB6C1Kayıt başarıyla tamamlandı!"
  register-failed: "&#FFA500Kayıt tamamlanamadı, lütfen tekrar deneyin."
  email-send-failed: "&#FFA500Doğrulama e-postası gönderilemedi. Lütfen tekrar deneyin."
  code-expired: "&#FFA500Doğrulama kodunun süresi doldu. Lütfen /register komutunu tekrar çalıştır."
  op-check-failed: "&#FFA500Güvenlik kontrolü başarısız oldu, tekrar deneyin."
  register-usage: "&#FFFFFFKullanım: &#FFB6C1/register <şifre> <email>"
  kod-usage: "&#FFFFFFKullanım: &#FFB6C1/kod <kod>"
  login-usage: "&#FFFFFFKullanım: &#FFB6C1/login <şifre>"
  weak-password: "&#FFB6C1Şifreniz çok düşük, en az 8 karakter olmalı."
  password-mismatch: "&#FFB6C1Şifreler eşleşmiyor."
  wrong-password: "&#FFB6C1Şifre yanlış."
  verification-sent: "&#FFFFFFDoğrulama kodu e-posta adresinize gönderildi."
  wrong-code: "&#FFB6C1Doğrulama kodu yanlış."
  invalid-email: "&#FFB6C1Geçerli bir e-posta adresi girin."
  need-login: "&#FFB6C1Önce giriş yapmanız gerekiyor."
  need-register: "&#FFB6C1Önce kayıt işlemini tamamlamanız gerekiyor."
  op-ip-locked: "&#FFA500Bu OP hesabına kayıtlı IP adresinden giriş yapmanız gerekiyor."
  registration-timeout: "&#FFA500Kayıt süresi doldu. Sunucudan çıkarılıyorsunuz."
  rate-limited: "&#FFA500Çok fazla yanlış deneme. Lütfen biraz sonra tekrar deneyin."
